name: Build and Package Installer

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --noconsole --onefile --name "SalsicciottoDash" src/main.py

    - name: Install Inno Setup via Chocolatey
      run: |
        choco install innosetup -y

    - name: Compile Installer with Inno Setup
      run: |
        $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        if (!(Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
        & $iscc installer.iss

    - name: Upload Standalone EXE
      uses: actions/upload-artifact@v4
      with:
        name: SalsicciottoDash-Standalone
        path: dist/SalsicciottoDash.exe

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SalsicciottoDash-Installer
        path: installer_output/SalsicciottoDash_Setup.exe
